name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build tweak
        run: |
          export THEOS="$HOME/theos"
          make clean && make package FINALPACKAGE=1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: BDNadBlock.dylib
          path: .theos/obj/BDNadBlock.dylib

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: BDNadBlock.deb
          path: packages/*.deb